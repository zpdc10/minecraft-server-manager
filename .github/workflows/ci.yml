name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Backend lint and tests
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt ruff
          ruff check app tests
          pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  image:
    # Publishes ghcr.io/<owner>/minecraft-server-manager:latest on every push to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/minecraft-server-manager:latest
            ghcr.io/${{ github.repository_owner }}/minecraft-server-manager:${{ github.sha }}
